<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="Terminal menampilkan hasil flutter devices yang terdeteksi">
  <rect x="0" y="0" width="960" height="260" rx="10" ry="10" fill="#0c0c0c" stroke="#3b3b3b" stroke-width="1"/>
  <rect x="0" y="0" width="960" height="34" rx="10" ry="10" fill="#1a1a1a"/>
  <rect x="0" y="18" width="960" height="16" fill="#1a1a1a"/>
  <text x="16" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cccccc">Windows PowerShell — flutter devices</text>
  <line x1="900" y1="17" x2="916" y2="17" stroke="#888" stroke-width="1.5"/>
  <line x1="928" y1="9" x2="944" y2="25" stroke="#888" stroke-width="1.5"/>
  <line x1="944" y1="9" x2="928" y2="25" stroke="#888" stroke-width="1.5"/>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="14">
    <text x="20" y="64" fill="#4ec9b0">PS D:\&gt; flutter devices</text>

    <text x="20" y="98"  fill="#c8c8c8">Found 2 connected devices:</text>
    <text x="40" y="126" fill="#c8c8c8">Windows (desktop) — windows — windows-x64 — Microsoft Windows [Version 10.0.26200.9457]</text>
    <text x="40" y="150" fill="#c8c8c8">Edge (web)        — edge    — web-javascript — Microsoft Edge 153.0.4234.32</text>

    <text x="20" y="186" fill="#9aa0a6">Run "flutter emulators" to list and start any available device emulators.</text>
    <text x="20" y="206" fill="#9aa0a6">If you expected another device to be detected, please run "flutter doctor" to</text>
    <text x="20" y="226" fill="#9aa0a6">diagnose potential issues.</text>

    <!-- Highlight that web target is available -->
    <rect x="18" y="238" width="430" height="0" fill="none"/>
  </g>
</svg>
