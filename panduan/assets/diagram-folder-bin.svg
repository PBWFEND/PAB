<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Diagram struktur folder menjelaskan mengapa folder bin berada di D:\flutter\flutter\bin">
  <rect x="0" y="0" width="960" height="250" fill="#ffffff"/>
  <g font-family="Consolas, monospace" font-size="15">
    <!-- Root -->
    <rect x="60" y="30" width="120" height="44" rx="4" fill="#1976d2"/>
    <text x="120" y="58" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="15">D:\</text>

    <line x1="180" y1="52" x2="230" y2="52" stroke="#555" stroke-width="2"/>

    <!-- flutter (destination) -->
    <rect x="232" y="30" width="160" height="44" rx="4" fill="#43a047"/>
    <text x="312" y="58" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="15">flutter</text>

    <line x1="392" y1="52" x2="442" y2="52" stroke="#555" stroke-width="2"/>

    <!-- inner flutter (the SDK folder the zip creates) -->
    <rect x="444" y="30" width="160" height="44" rx="4" fill="#43a047"/>
    <text x="524" y="58" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="15">flutter</text>
    <text x="524" y="90" text-anchor="middle" fill="#7c4dff" font-family="Segoe UI" font-size="12">(dibuat otomatis oleh zip)</text>

    <line x1="524" y1="74" x2="524" y2="118" stroke="#555" stroke-width="2"/>

    <!-- bin folder -->
    <rect x="460" y="120" width="128" height="44" rx="4" fill="#ff7043"/>
    <text x="524" y="148" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="15">bin</text>

    <!-- contents -->
    <line x1="588" y1="142" x2="640" y2="110" stroke="#888" stroke-width="1.5"/>
    <line x1="588" y1="142" x2="640" y2="160" stroke="#888" stroke-width="1.5"/>
    <rect x="642" y="98"  width="180" height="28" rx="3" fill="#fff" stroke="#ff7043" stroke-width="1.5"/>
    <text x="652" y="117" fill="#bf360c" font-family="Segoe UI" font-size="13">flutter.bat</text>
    <rect x="642" y="148" width="180" height="28" rx="3" fill="#fff" stroke="#ff7043" stroke-width="1.5"/>
    <text x="652" y="167" fill="#bf360c" font-family="Segoe UI" font-size="13">dart.bat</text>

    <!-- Final path label -->
    <rect x="60" y="196" width="840" height="40" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
    <text x="480" y="221" text-anchor="middle" fill="#e65100" font-family="Segoe UI" font-size="15" font-weight="600">
      PATH = D:\flutter\flutter\bin   ←   folder bin ada di dalam folder flutter, yang ada di dalam D:\flutter
    </text>
  </g>
</svg>
